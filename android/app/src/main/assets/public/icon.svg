<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="white" stroke-opacity="0.12" stroke-width="6" />

  <!-- Main Symbol Container -->
  <g filter="url(#softShadow)" transform="translate(0, -6)">
    <!-- Open Book Base (Education & Attendance) -->
    <path d="M 120 330 C 170 300, 230 310, 256 328 C 282 310, 342 300, 392 330 L 392 372 C 342 342, 282 352, 256 370 C 230 352, 170 342, 120 372 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 256 328 L 256 370" stroke="#059669" stroke-width="4" stroke-linecap="round" />

    <!-- Feeding Bowl (Nourishment & Community Service) -->
    <path d="M 160 230 C 160 295, 352 295, 352 230 Z" fill="url(#goldGrad)" />
    <!-- Bowl Rim -->
    <ellipse cx="256" cy="230" rx="96" ry="16" fill="#fde68a" />
    
    <!-- Heart & Nourishing Steam / Sprout (Love, Children, Care) -->
    <path d="M 256 185 C 246 160, 218 160, 218 185 C 218 206, 256 226, 256 226 C 256 226, 294 206, 294 185 C 294 160, 266 160, 256 185 Z" fill="#ffffff" />

    <!-- Children / Community Warmth Sparkles -->
    <circle cx="188" cy="172" r="8" fill="#fef08a" />
    <circle cx="324" cy="172" r="8" fill="#fef08a" />
    <circle cx="256" cy="138" r="6" fill="#fef08a" />

    <!-- Checkmark on Attendance / Bookmark Ribbon -->
    <path d="M 256 370 L 272 414 L 256 404 L 240 414 Z" fill="#f59e0b" />
  </g>
</svg>
