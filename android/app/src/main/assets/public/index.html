    <script>
      (function() {
        try {
          var stored = localStorage.getItem('rollcall_settings_v2');
          var theme = 'light';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.theme) {
              theme = parsed.theme;
            }
          }
          if (theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script>
      // Capture beforeinstallprompt before React mounts
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('app-install-prompt-ready'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
