name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the pain point?
      placeholder: "Teachers currently cannot..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: "Add a new button on the Reports screen that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other solutions or workarounds you've thought of?

  - type: dropdown
    id: area
    attributes:
      label: Area of Application
      options:
        - Attendance (Take/Edit/History)
        - Students (Roster/Import/Archive)
        - Feeding Program (Reports/Schedule)
        - Reports/Export (PDF/Word/Excel)
        - Settings/Preferences
        - PWA/Offline/Install
        - Mobile/Capacitor
        - i18n/Language/Calendar
        - Data/Backup/Sync
        - UI/UX/Design
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (Nice to have)
        - Medium (Would improve workflow)
        - High (Blocks important use case)
        - Critical (Data loss/security)

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Sketches
      description: Drag and drop any wireframes, sketches, or reference screenshots

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/feature requests for duplicates
          required: true
        - label: This feature aligns with the app's scope (offline-first teacher tool for attendance & feeding)
          required: true